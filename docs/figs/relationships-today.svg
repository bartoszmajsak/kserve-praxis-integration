<svg viewBox="0 0 1040 620" role="img" aria-label="Custom resources today. The LLMInferenceService owns the HTTPRoute, the InferencePool and the EPP. The HTTPRoute references the tenant Gateway and owns the per-model TokenRateLimitPolicy that MaaS writes. MaaSModelRef references the service and the AITenant and takes its status from the HTTPRoute. The AITenant references the Gateway, which owns the AuthPolicy." xmlns="http://www.w3.org/2000/svg">
