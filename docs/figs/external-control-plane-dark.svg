<svg viewBox="0 0 1040 574" role="img" aria-label="Custom resources of an external model in the recommended arrangement. The user writes the MaaSModelRef, the ExternalModel, the ExternalProvider and the credential Secret. AGC resolves the providers into the status of the ExternalModel and copies the Secret into the tenant namespace. MaaS reads that status and writes the routing and one upstream cluster per provider into the Proxy of the tenant, which gateway-controller renders." xmlns="http://www.w3.org/2000/svg">
