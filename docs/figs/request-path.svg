<svg viewBox="0 0 1040 572" role="img" aria-label="Request path today and with Praxis, as stacks of layers. Today the request goes through an Istio Gateway that stacks payload processing, Kuadrant, a per-model HTTPRoute and an ext_proc filter. In the target setup the platform ingress only forwards to a Praxis proxy that stacks a policy slot and a routing slot. The per-model routing decision moves from the HTTPRoute to the routing slot." xmlns="http://www.w3.org/2000/svg">
