<svg viewBox="0 0 1040 658" role="img" aria-label="Request path of an external model, as stacks of layers. Today the request goes through the Istio Gateway, where two ext_proc filters call Praxis servers around Kuadrant, an HTTPRoute matches the chosen provider, and Envoy connects to the provider with a ServiceEntry and a DestinationRule. With Praxis as the proxy, the tenant Gateway forwards to the proxy, which chooses the provider, adds the credential and connects to the provider through an upstream cluster." xmlns="http://www.w3.org/2000/svg">
