<svg viewBox="0 0 1040 590" role="img" aria-label="Custom resources in option 1. KServe creates the ModelProvider in the tenant namespace, next to the Proxy and the Policy that MaaS creates. The provider references the AITenant and the InferencePool, and MaaS sets its status.proxyRef. No ownerReference links the provider to the LLMInferenceService, and the service needs a reference to the tenant that is not defined." xmlns="http://www.w3.org/2000/svg">
