<svg viewBox="0 0 1040 410" role="img" aria-label="Ownership with MaaS creating the ModelProvider. The KServe controller owns the LLMInferenceService status and the pool or Service. The MaaS controller reads that status and creates the ModelProvider next to the MaaSModelRef, the Proxy and the Policy. gateway-controller reads the ModelProvider and configures the Praxis proxy, which sends requests to the pool or Service. Dependencies run in one direction." xmlns="http://www.w3.org/2000/svg">
