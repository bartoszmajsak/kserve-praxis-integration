# Publishes site/ to GitHub Pages. Pages has to be enabled on the repository with
# "GitHub Actions" as the source.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

# A deployment in progress finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # site/ is committed. The check stops the deployment when it is behind src/ or tools/.
      - name: Check that site/ matches src/ and tools/
        run: make check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-24.04
    # This job runs no code from the repository. It hands the uploaded artifact to Pages.
    permissions:
      pages: write     # create the Pages deployment
      id-token: write  # the OIDC token Pages uses to verify where the deployment comes from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
